name: tests

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'chatgpt-')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Check Python 3.9 source compatibility
        run: python tests/test_python39_compat.py

      - name: Checkout KKRunner
        uses: actions/checkout@v7
        with:
          repository: lokik/kkrunner-chat
          ref: 9f6e027051979a655fce2cb17d009657b8509670
          path: .ci/kkrunner

      # The embedding and editor branches use the native cluster backend,
      # including its DATASET and ADSI validation and filename escaping.
      - name: Checkout ASE2SPRKKR
        uses: actions/checkout@v7
        with:
          repository: lokik/ase2sprkkr-chat
          ref: >-
            ${{ (github.base_ref == 'cluster' || github.base_ref == 'embedding-host-scf' || github.base_ref == 'editor'
                || github.head_ref == 'cluster' || github.head_ref == 'embedding-host-scf'
                || github.head_ref == 'guided-structure-type' || github.head_ref == 'editor'
                || github.head_ref == 'editor-native-identifiers'
                || github.ref_name == 'cluster' || github.ref_name == 'embedding-host-scf'
                || github.ref_name == 'guided-structure-type' || github.ref_name == 'editor'
                || github.ref_name == 'editor-native-identifiers') && 'cluster' || 'develop' }}
          path: .ci/ase2sprkkr

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/kkrunner
          python -m pip install -e ./.ci/ase2sprkkr
          # Package identity tests inspect setuptools' package discovery.
          # Build isolation does not expose build requirements to pytest.
          python -m pip install -e . pytest 'setuptools>=61'

      - name: Run tests
        run: python -m pytest -q
