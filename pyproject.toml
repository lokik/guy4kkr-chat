[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ase2sprkkr-gui"
version = "0.2.0b1"
description = "PyQt6 GUI for building/editing ASE structures and running SPR-KKR via ase2sprkkr."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "kkrunner>=0.2.0b2,<0.3",
  "PyQt6",
  "qonsole>=3.3,<4",
  "matplotlib",
  "numpy",
  "ase",
  "platformdirs",
  "pyxtal",
  "ase2sprkkr>=4.0.0b3,<5",
]

[project.scripts]
"ase2sprkkr-gui" = "ase2sprkkr_gui.main:main"

[project.entry-points."ase2sprkkr"]
cli = "ase2sprkkr_gui.cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ase2sprkkr_gui*"]

[tool.setuptools.package-data]
ase2sprkkr_gui = [
  "assets/icons/*.svg",
  "assets/icons/*.png",
  "assets/icons/*.md",
  "assets/icons/COPYING-ICONS",
  "assets/structures/*.dat",
  "assets/structures/*.md",
]

[tool.uv.sources]
ase2sprkkr = { path = "../ase2sprkkr", editable = true }
kkrunner = { path = "../kkrunner", editable = true }
